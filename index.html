(function(){
  const phHour=()=>+new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Manila',hour:'numeric',hourCycle:'h23'}).format(new Date());
  let pref='auto';try{pref=localStorage.getItem('moolah-mode')||'auto'}catch(_){}
  function apply(){const h=phHour(),m=pref==='auto'?(h>=6&&h<18?'light':'dark'):pref;const r=document.documentElement;r.dataset.ph=m;r.style.colorScheme=m;
    const b=document.getElementById('modebtn');if(b)b.textContent=pref==='auto'?`Auto · PH time ${m==='light'?'☀':'☾'}`:m==='light'?'Light ☀':'Dark ☾'}
  apply();setInterval(apply,60000);
  document.addEventListener('DOMContentLoaded',()=>{apply();document.getElementById('modebtn')?.addEventListener('click',()=>{pref=pref==='auto'?'light':pref==='light'?'dark':'auto';try{localStorage.setItem('moolah-mode',pref)}catch(_){}apply()})});
})();

  const expr=()=>{let v=term();while(t[i]==='+'||t[i]==='-'){const o=t[i++],r=term();v=o==='+'?v+r:v-r}return v};
  const v=expr();if(i!==t.length||!isFinite(v))throw new Error('bad');return Math.round(v*100)/100}
const num=s=>{try{return calc(s)}catch(_){return 0}};
const hasOp=s=>/\d\s*[-+*/xX×÷−]\s*[\d(]/.test(String(s).replace(/^[-+]/,''));

// money lent through the Lending tab, counted in the month it went out
function lentIn(k){const out=[];for(const [id,L] of Object.entries(loans||{})){
    if(L.type==='ledger'){(L.entries||[]).forEach(e=>{if(e.kind==='lent'&&e.date&&e.date.slice(0,7)===k)out.push({id,name:`${L.borrower} · ${e.label}`,amount:e.amount})})}
    else if(L.lentOn===k)out.push({id,name:`${L.borrower} · ${L.item||L.group||'Loan'}`,amount:L.principal||0})}
  return out}
function monthCalc(k){
  const d=months[k]||{};let incE=0,incA=0;
  for(const s of SRC_KEYS){const r=d.income?.[s];if(r){incE+=r.expected||0;incA+=r.actual||0}}
  const g={};for(const G of GROUPS)g[G.id]={b:0,a:0};
  for(const c of cats()){const it=d.items?.[c.id];if(it&&g[c.group]){g[c.group].b+=it.budget||0;g[c.group].a+=it.actual||0}}
  for(const x of lentIn(k))g.lending.a+=x.amount;
  const needs=GROUPS.filter(G=>G.kind==='needs').reduce((s,G)=>s+g[G.id].a,0);
  return {incE,incA,g,needs,wants:g.wants.a,lending:g.lending.a};
}
function savingsSeries(){
  const last={ef:0,house:0,biz:0},cumI={ef:0,house:0,biz:0},out={};
  for(const k of KEYS){
    const sv=months[k]?.savings||{};const row={};let dep=0,int=0;
    for(const A of ACCOUNTS){
      const s=sv[A.id]||{};const has=typeof s.balance==='number';
      const d=has?s.balance-last[A.id]:0; if(has)last[A.id]=s.balance;
      cumI[A.id]+=s.interest||0;
      row[A.id]={dep:d,bal:last[A.id],int:s.interest||0,run:last[A.id]+cumI[A.id],entered:has};
      dep+=d;int+=s.interest||0;
    }
    row.dep=dep;row.int=int;row.total=ACCOUNTS.reduce((s,A)=>s+row[A.id].run,0);out[k]=row;
  }
  return out;
}
function hasData(k){const d=months[k];if(!d)return false;
  if(Object.values(d.income||{}).some(r=>r.actual))return true;
  if(Object.values(d.items||{}).some(r=>r.actual))return true;
  return Object.values(d.savings||{}).some(s=>typeof s.balance==='number');}
function activeKeys(){let last=KEYS.indexOf(NOWKEY);KEYS.forEach((k,i)=>{if(hasData(k)&&i>last)last=i});
  let first=KEYS.findIndex(hasData);if(first<0)first=0;if(last<first)last=first;return KEYS.slice(first,last+1)}

function setStatus(t,bad){const el=document.getElementById('status');el.textContent=t;el.style.color=bad?'var(--over)':''}
function clone(o){return JSON.parse(JSON.stringify(o))}
async function persist(path,getBody){
  if(!db||!canWrite){setStatus('Not saved: read-only',true);return}
  if(saving[path]){saving[path].again=true;return}
  saving[path]={again:false};setStatus('Saving…');
  try{do{saving[path].again=false;await db.doc(path).set(clone(getBody()))}while(saving[path].again);setStatus('Saved')}
  catch(e){if(e&&e.code==='invalid_argument'){canWrite=false;setStatus('You can view but not edit',true)}else setStatus('Could not save. Check your connection and try again.',true)}
  finally{delete saving[path]}
}

    <p class="hint">${!A.amount?'Type your real total across all accounts to compare.':Math.abs(gap2)<1?'Balanced.':gap2>0?'Your accounts hold more than the tracker shows. Update the latest month\'s balances and interest in Month to match.':'The tracker shows more than your accounts hold. Check the latest balances in Month.'}</p></div></div></section>`}

let chartRows=[];
function capBar(w,k){const cap=capOf(k),p=w/cap;return `<div class="capbar"><div class="track"><i style="width:${Math.min(p,1)*100}%;background:var(${p>1?'--over':'--s5'})"></i></div><span class="${p>1?'neg':'muted'}">${p>1?`${fmt0(w-cap)} over the cap`:`${fmt0(cap-w)} left of your cap`}</span></div>`}
function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,2,2.5,5,10])if(m*p>=v)return m*p}
function monthChart(rows){
  chartRows=rows;
  const W=760,H=300,L=52,R=8,T=12,B=28,pw=W-L-R,ph=H-T-B;
  const max=niceMax(Math.max(...rows.map(r=>Math.max(r.c.incA,r.c.needs+r.c.wants)),1));
  const y=v=>T+ph-(v/max)*ph, n=rows.length, slot=pw/n, bw=Math.min(44,slot*.62);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly spending by group with income markers">`;
  for(let i=0;i<=4;i++){const v=max*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`}
  const step=Math.ceil(n/12);
  rows.forEach((r,i)=>{const cx=L+slot*i+slot/2;let acc=0;const segs=GROUPS.map(G=>({v:r.c.g[G.id].a,c:G.c})).filter(p=>p.v>0);
    segs.forEach((p,j)=>{const y0=y(acc),y1=y(acc+p.v);acc+=p.v;const h=Math.max(y0-y1-2,0.5);const top=j===segs.length-1;
      s+=top?`<path d="${roundTop(cx-bw/2,y1,bw,h,4)}" fill="var(${p.c})"/>`:`<rect x="${cx-bw/2}" y="${y1}" width="${bw}" height="${h}" fill="var(${p.c})"/>`});
    if(r.c.incA>0)s+=`<line x1="${cx-bw/2-6}" x2="${cx+bw/2+6}" y1="${y(r.c.incA)}" y2="${y(r.c.incA)}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>`;
    if(i%step===0)s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${MN[+r.k.slice(5)-1]}${r.k.slice(5)==='01'||i===0?" '"+r.k.slice(2,4):''}</text>`;
    s+=`<rect class="hit" data-i="${i}" x="${L+slot*i}" y="${T}" width="${slot}" height="${ph}" fill="transparent"/>`;
  });
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/></svg><div class="tip" id="tip" hidden></div>`;
  return s;
}
function roundTop(x,y,w,h,r){r=Math.min(r,h,w/2);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}

function balChart(ks,S){
  const W=760,H=220,L=52,R=12,T=14,B=26,pw=W-L-R,ph=H-T-B;const vals=ks.map(k=>S[k].total);
  const max=niceMax(Math.max(...vals,1));const x=i=>L+(ks.length<2?pw/2:pw*i/(ks.length-1)),y=v=>T+ph-(v/max)*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Total savings balance by month">`;
  for(let i=0;i<=4;i++){const v=max*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`}
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  s+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(vals.length-1)},${y(0)}" fill="var(--s6)" opacity=".14"/><polyline points="${pts}" fill="none" stroke="var(--s6)" stroke-width="2" stroke-linejoin="round"/>`;
  const step=Math.ceil(ks.length/12);
  vals.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===vals.length-1?5:3}" fill="var(--s6)" stroke="var(--surface)" stroke-width="2"><title>${label(ks[i])}: ${fmt0(v)}</title></circle>`;if(i%step===0||i===vals.length-1)s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${MN[+ks[i].slice(5)-1]}</text>`});
  const li=vals.length-1;s+=`<text x="${Math.min(x(li),W-R-4)}" y="${y(vals[li])-12}" text-anchor="end" style="fill:var(--ink);font-weight:600">${fmt0(vals[li])}</text></svg>`;
  return s;
}

const SECTIONS=[['needs','Needs','--s1'],['sinking','Sinking Funds','--s3'],['wants','Wants','--s5']];
let capMemo={};
const capRules=()=>settings.wantsCaps||(settings.wantsCap?[{from:KEYS[0],amount:settings.wantsCap,carry:false}]:[]);
const wantsCap=()=>{const r=capRules().filter(x=>x.from<=NOWKEY).pop()||capRules()[0];return r?r.amount:0};
// a month's wants cap: its rule's amount plus whatever was left unspent last month when the rule carries over
function capInfo(k){if(capMemo[k])return capMemo[k];const rule=capRules().filter(x=>x.from<=k).pop();let out={base:0,carry:0,cap:0,rollover:false};
  if(rule){let carry=0;const i=KEYS.indexOf(k);if(rule.carry===true&&i>0&&KEYS[i-1]>=rule.from){const pk=KEYS[i-1],pi=capInfo(pk);carry=Math.max(0,pi.cap-monthCalc(pk).wants)}
    out={base:rule.amount,carry,cap:rule.amount+carry,rollover:rule.carry===true,toFund:rule.carry==='fund'}}
  return capMemo[k]=out}
const capOf=k=>capInfo(k).cap;
// all shopping categories together have their own limit inside the wants cap
const isShopping=c=>c.group==='wants'&&(/^shopping/i.test(c.id)||/^shopping/i.test(c.name));
const shopRule=k=>(settings.shoppingCaps||[]).filter(x=>x.from<=k).pop();
const shopOf=k=>shopRule(k)?.amount||0;
const shopSpent=k=>cats().filter(isShopping).reduce((s,c)=>s+(months[k]?.items?.[c.id]?.actual||0),0);
function shopBar(k){const cap=shopOf(k);if(!cap)return '';const w=shopSpent(k),p=w/cap;
  return `<div class="capbar"><div class="track"><i style="width:${Math.min(p,1)*100}%;background:var(${p>1?'--over':'--s4'})"></i></div><span class="${p>1?'neg':'muted'}">Shopping: ${fmt0(w)} of ${fmt0(cap)}${p>1?` · ${fmt0(w-cap)} over`:''}</span></div>`}

function runPlan(fromI,base,left,salary,share,G,buffer){
  const out={};KEYS.slice(fromI).forEach((k,n)=>{const cum=Math.max(0,(n+1)*left-(buffer?salary:0));const over=Math.max(0,base.ef+cum-G.ef);
    out[k]={cum,over,ef:Math.min(G.ef,base.ef+cum),
      house:Math.min(G.house,base.house+share*over+Math.max(0,base.biz+(1-share)*over-G.biz)),
      biz:Math.min(G.biz,base.biz+(1-share)*over+Math.max(0,base.house+share*over-G.house))}});
  return out;
}
function projection(){
  const P=settings.plan;if(!P||!P.lines)return null;
  const salary=P.lines.reduce((s,l)=>s+(l.amount||0),0),left=Math.max(0,(P.expectedIncome||0)-salary),share=P.dhShare??0.8;
  const S=savingsSeries(),G={ef:goalOf('ef'),house:goalOf('house'),biz:goalOf('biz')};
  const startI=Math.max(KEYS.indexOf(P.start||'2026-11'),1);
  const bal=k=>({ef:S[k].ef.run,house:S[k].house.run,biz:S[k].biz.run});
  // the original plan, from balances the month before it starts
  const plan=runPlan(startI,bal(KEYS[startI-1]),left,salary,share,G,true);
  // forecast, from the latest month you entered a balance
  let lastI=-1;KEYS.forEach((k,i)=>{if(ACCOUNTS.some(A=>S[k][A.id].entered))lastI=i});
  const fc=lastI>=startI?runPlan(lastI+1,bal(KEYS[lastI]),left,salary,share,G,false):plan;
  const rows=KEYS.slice(startI).map((k,j)=>{const i=startI+j,actual=i<=lastI;const v=actual?bal(k):fc[k];
    return {k,actual,ef:v.ef,house:v.house,biz:v.biz,total:v.ef+v.house+v.biz,plan:plan[k],planTotal:plan[k].ef+plan[k].house+plan[k].biz}});
  const hit=id=>{const r=rows.find(r=>r[id]>=G[id]);if(r)return r.k;if(bal(KEYS[startI-1])[id]>=G[id])return KEYS[startI-1]};
  const lastActual=lastI>=0?KEYS[lastI]:null;
  return {salary,left,share,rows,byKey:plan,start:KEYS[startI],baseK:KEYS[startI-1],lastActual,G,hits:{ef:hit('ef'),house:hit('house'),biz:hit('biz')}};
}
// split each month's actual left over (income − needs − wants − lending) by the plan's rules
function leftoverSplit(share){
  const S=savingsSeries();
  return activeKeys().map(k=>{const c=monthCalc(k);if(!c.incA)return null;const i=KEYS.indexOf(k);const prev=i>0?S[KEYS[i-1]]:null;
    const left=c.incA-c.needs-c.wants-c.lending,pos=Math.max(left,0);
    const room=Math.max(0,goalOf('ef')-(prev?prev.ef.run:0));const ef=Math.min(pos,room),rest=pos-ef;
    return {k,left,ef,house:rest*share,biz:rest*(1-share),saved:S[k].dep}}).filter(Boolean);
}

function projChart(PJ){

  for(let i=0;i<=4;i++){const v=max*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`}

function pie(parts){
  const tot=parts.reduce((s,p)=>s+p.v,0)||1,R=90,c=100;let a=-Math.PI/2,s=`<svg viewBox="0 0 200 200" class="pie" role="img" aria-label="Allocation pie chart">`;
  for(const p of parts){const f=p.v/tot,a2=a+f*Math.PI*2;
    const d=f>=0.9999?`M${c},${c-R}A${R},${R} 0 1 1 ${c-0.01},${c-R}Z`:`M${c},${c}L${c+R*Math.cos(a)},${c+R*Math.sin(a)}A${R},${R} 0 ${f>0.5?1:0} 1 ${c+R*Math.cos(a2)},${c+R*Math.sin(a2)}Z`;
    s+=`<path d="${d}" fill="var(${p.c})" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round"><title>${esc(p.n)}: ${fmt0(p.v)} (${pct(f)})</title></path>`;

}

  const d=months[k]||{},spent=id=>d.items?.[id]?.actual||0;

  const ci=capInfo(k);const lines=P.lines.map(l=>({...l,amount:l.id==='wants'&&ci.rollover?ci.cap:l.amount,carry:l.id==='wants'&&ci.rollover?ci.carry:0,v:(l.cats||[]).reduce((s,id)=>s+spent(id),0)}));
  const salary=lines.reduce((s,l)=>s+(l.amount||0)-(l.carry||0),0),used=lines.reduce((s,l)=>s+l.v,0);
  const other=cats().filter(c=>!mapped.has(c.id)&&spent(c.id)>0);const otherT=other.reduce((s,c)=>s+spent(c.id),0);
  const bar=(v,a)=>{const p=a?v/a:v>0?2:0;return `<span class="track"><i style="width:${Math.min(p,1)*100}%;background:var(${p>1?'--over':p>.85?'--s4':'--s6'})"></i></span>`};
  const before=(P.start||'2026-11')>k;
  return `<section class="panel"><div class="row" style="justify-content:space-between"><div><h3>Month budget · ${fmt0(salary)}</h3>
    <p class="hint" style="margin:0">Your monthly budget split by the Savings plan. Bars fill from what you enter in the tables below.${before?` The salary starts ${label(P.start||'2026-11')}, so this month is for comparison only.`:''}</p></div>
    <span class="${used>salary?'neg':'muted'}">${fmt0(used)} used · ${used>salary?fmt0(used-salary)+' over':fmt0(salary-used)+' left'}</span></div>
    ${bar(used,salary)}
    ${SECTIONS.filter(([sid])=>lines.some(l=>l.section===sid)).map(([sid,sn])=>`<div class="sal-sec"><span class="eyebrow">${sn}</span>${lines.filter(l=>l.section===sid).map(l=>{const rem=(l.amount||0)-l.v;
      return `<div class="sal"><div class="sal-h"><span>${esc(l.name)}${l.carry?`<span class="muted" style="font-size:12px"> · incl. ${fmt0(l.carry)} carried over</span>`:''}${sid==='sinking'?'<span class="muted" style="font-size:12px"> · set aside monthly</span>':''}</span><span class="${rem<0?'neg':''}">${fmt0(l.v)} / ${fmt0(l.amount)}</span></div>${bar(l.v,l.amount)}
      <div class="sal-f"><span class="hint">${(l.cats||[]).map(id=>cats().find(c=>c.id===id)?.name).filter(Boolean).map(esc).join(', ')||'No categories linked'}</span><span class="hint ${rem<0?'neg':''}">${rem<0?fmt0(-rem)+' over':fmt0(rem)+' left'}</span></div></div>`}).join('')}</div>`).join('')}
    ${other.length?`<div class="sal-sec"><span class="eyebrow">Not in the salary plan</span><div class="sal"><div class="sal-h"><span>${other.map(c=>esc(c.name)).join(', ')}</span><span>${fmt0(otherT)}</span></div><span class="hint">Spending in categories no plan line covers. Ask Claude to link them to a line.</span></div></div>`:''}
  </section>`;
}

// ---------- interactions ----------
function wire(){
  wireLending();wireBigPlans();
  const wp=document.getElementById('wantspick');if(wp)wp.addEventListener('change',()=>{wantsMonth=wp.value;render()});
  app.querySelectorAll('[data-wm]').forEach(el=>el.addEventListener('click',()=>{wantsMonth=el.dataset.wm;render()}));
  app.querySelectorAll('input.num').forEach(el=>el.addEventListener('change',onNum));
  app.querySelectorAll('[data-goto]').forEach(el=>{const go=()=>{curMonth=el.dataset.goto;location.hash='month'};el.addEventListener('click',go);el.addEventListener('keydown',e=>{if(e.key==='Enter')go()})});
  app.querySelectorAll('.hit').forEach(el=>{el.addEventListener('pointermove',e=>showTip(+el.dataset.i,e));el.addEventListener('pointerleave',()=>{const t=document.getElementById('tip');if(t)t.hidden=true})});
  const sp=document.getElementById('splitpick');if(sp)sp.addEventListener('change',()=>{splitMonth=sp.value;render()});
  const mp=document.getElementById('monthpick');if(mp)mp.addEventListener('change',()=>{curMonth=mp.value;render()});
  const notes=document.getElementById('notes');if(notes){notes.addEventListener('change',()=>{const d=monthDoc(curMonth);d.notes=notes.value;notes.dataset.orig=notes.value;saveMonth(curMonth)})}
  app.querySelectorAll('form.addcat').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();const inp=f.querySelector('input');const name=inp.value.trim();if(!name)return;
    const base=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'cat';let id='c-'+base,n=2;while(cats().some(c=>c.id===id))id='c-'+base+'-'+n++;
    settings.customCats=(settings.customCats||[]).concat([{id,name,group:f.dataset.g}]);inp.value='';saveSettings();render()}));
  const lf=document.getElementById('logform');if(lf)lf.addEventListener('submit',e=>{e.preventDefault();const amt=num(document.getElementById('log-amt').value);if(!amt){document.getElementById('log-amt').focus();return}
    const cid=document.getElementById('log-cat').value,note=document.getElementById('log-note').value.trim();const d=monthDoc(curMonth);const it=d.items[cid]||(d.items[cid]={budget:0,actual:0});
    it.actual=Math.round(((it.actual||0)+amt)*100)/100;const cname=cats().find(c=>c.id===cid)?.name||cid;
    d.notes=(d.notes?d.notes.replace(/\s+$/,'')+'\n':'')+`${amt.toLocaleString('en-PH')} ${note||cname}`;saveMonth(curMonth);render();const cw=monthCalc(curMonth).wants;const cc=cats().find(c=>c.id===cid);if(capOf(curMonth)&&cw>capOf(curMonth)&&cc?.group==='wants')setStatus(`Added. Wants are now ${fmt0(cw-capOf(curMonth))} over your cap`,true);else if(cc&&isShopping(cc)&&shopOf(curMonth)&&shopSpent(curMonth)>shopOf(curMonth))setStatus(`Added. Shopping is now ${fmt0(shopSpent(curMonth)-shopOf(curMonth))} over its ${fmt0(shopOf(curMonth))} limit`,true);else setStatus(`Added ${fmt(amt)} to ${cname}`)});
  app.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.act,i=KEYS.indexOf(curMonth);
    if(a==='prev'&&i>0)curMonth=KEYS[i-1];if(a==='next'&&i<KEYS.length-1)curMonth=KEYS[i+1];if(a==='togglecats')showAllCats=!showAllCats;
    if(a==='copybudget'){let j=i-1;while(j>=0&&!Object.values(months[KEYS[j]]?.items||{}).some(x=>x.budget))j--;
      if(j<0){setStatus('No earlier budget to copy');return}const src=months[KEYS[j]],d=monthDoc(curMonth);let n=0;
      for(const [cid,it] of Object.entries(src.items||{}))if(it.budget&&!(d.items[cid]?.budget)){(d.items[cid]||(d.items[cid]={budget:0,actual:0})).budget=it.budget;n++}
      for(const [s,r] of Object.entries(src.income||{}))if(r.expected&&!(d.income[s]?.expected)){(d.income[s]||(d.income[s]={expected:0,actual:0})).expected=r.expected;n++}
      if(n)saveMonth(curMonth);setStatus(n?`Copied ${n} budget lines from ${label(KEYS[j])}`:'Budgets already filled');}
    render()}));
}
function onNum(e){const el=e.target;let v;try{v=calc(el.value)}catch(_){el.value=el.dataset.orig||'';setStatus("That amount didn't add up. Use numbers with + − × ÷.",true);return}
  const f=el.dataset.f,c=el.dataset.c,k=el.dataset.k;el.value=editVal(v);el.dataset.orig=editVal(v);
  if(f==='plan'){const P=settings.plan;if(c==='income')P.expectedIncome=v;else if(c==='cap'){const rs=clone(capRules());if(rs.length)rs[rs.length-1].amount=v;else rs.push({from:NOWKEY,amount:v,carry:false});settings.wantsCaps=rs}else if(c==='share')P.dhShare=Math.min(Math.max(v/100,0),1);else{const ln=P.lines.find(l=>l.id===c);if(ln)ln.amount=v}saveSettings();render();return}
  if(f==='month'){const d=monthDoc(curMonth);if(el.value.trim()==='')delete d[c];else d[c]=v;saveMonth(curMonth);render();return}
  if(f==='actual'){settings.actualSavings={amount:v,date:TODAY};saveSettings();render();return}
  if(f==='goal'){settings.goals={...(settings.goals||{}),[c]:v||1000000};saveSettings();render();return}
  const d=monthDoc(curMonth);
  if(f==='item'){const it=d.items[c]||(d.items[c]={budget:0,actual:0});it[k]=v;if(!it.budget&&!it.actual)delete d.items[c]}
  if(f==='inc'){const r=d.income[c]||(d.income[c]={expected:0,actual:0});r[k]=v;if(!r.expected&&!r.actual)delete d.income[c]}
  if(f==='sav'){const s=d.savings[c]||(d.savings[c]={});if(el.value.trim()==='')delete s[k];else s[k]=v;if(!Object.keys(s).length)delete d.savings[c]}
  saveMonth(curMonth);render();
}
function route(){const h=location.hash.slice(1);view=['overview','month','goals','plan','lending','bigplans'].includes(h)?h:'overview';render()}
// "=" or Enter in an amount box works the sum out; a running total shows while typing
app.addEventListener('keydown',e=>{const el=e.target;if(!el.matches||!el.matches('input[data-calc]'))return;
  if(e.key==='='||(e.key==='Enter'&&el.classList.contains('num'))){e.preventDefault();let v;try{v=calc(el.value)}catch(_){setStatus("That amount didn't add up. Use numbers with + − × ÷.",true);return}
    el.value=editVal(v);if(el.classList.contains('num')){if(el.value!==el.dataset.orig)onNum({target:el})}else setStatus('= '+fmt(v))}});
app.addEventListener('input',e=>{const el=e.target;if(!el.matches||!el.matches('input[data-calc]'))return;if(hasOp(el.value)){try{setStatus('= '+fmt(calc(el.value)))}catch(_){setStatus('…')}}});
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});

// ---------- boot (stand-alone app: Firebase sign-in + Firestore under users/<uid>/) ----------
function firestoreDb(fs,uid){
  const base=fs.collection('users').doc(uid);
  const ref=p=>{const [c,d]=p.split('/');return base.collection(c).doc(d)};
  const wrap=s=>({id:s.id,exists:s.exists,data:()=>s.data(),metadata:{fromCache:s.metadata.fromCache,hasPendingWrites:s.metadata.hasPendingWrites}});
  return {
    collection:name=>({onSnapshot:(next,err)=>base.collection(name).onSnapshot(q=>next({docs:q.docs.map(wrap),size:q.size,empty:q.empty}),err)}),
    doc:p=>({onSnapshot:(next,err)=>ref(p).onSnapshot(s=>next(wrap(s)),err),
      // resolve once the write is queued locally so saving works offline; Firestore syncs when back online
      set:d=>{const w=ref(p).set(d);return Promise.race([w,new Promise(r=>setTimeout(r,1500))])},
      delete:()=>{const w=ref(p).delete();return Promise.race([w,new Promise(r=>setTimeout(r,1500))])},
      get:()=>ref(p).get().then(wrap)})};
}
const foot=document.getElementById('foot');
const AUTH_ERR={'auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/user-not-found':'No account with that email yet. Tap Create account.',
  'auth/email-already-in-use':'That email already has an account. Tap Sign in instead, or use Google.','auth/weak-password':'Use a password with at least 6 characters.',
  'auth/invalid-email':'That email doesn\'t look right.','auth/operation-not-allowed':'Email sign-in isn\'t switched on in Firebase yet.','auth/unauthorized-domain':'This website isn\'t on the Firebase authorized domains list yet.',
  'auth/popup-closed-by-user':'The Google window was closed before signing in.'};
const authMsg=e=>AUTH_ERR[e&&e.code]||(e&&e.message)||'Sign-in failed.';
function signInView(msg){
  app.innerHTML=`<div class="panel empty" style="display:grid;gap:14px;justify-items:center;max-width:380px;margin:0 auto"><h2>Welcome to MOOLAAAAAAH!!</h2><p>Sign in to see your tracker. Only you can read your data.</p>
  ${msg?`<p class="neg">${esc(msg)}</p>`:''}<button class="primary" id="signin">Sign in with Google</button>
  <p class="hint">or use your email and a password</p>
  <form id="emailform" style="display:grid;gap:8px;width:100%">
    <input class="txt" type="email" id="em" placeholder="Email" autocomplete="username" required>
    <input class="txt" type="password" id="pw" placeholder="Password (6+ characters)" autocomplete="current-password" minlength="6" required>
    <div style="display:flex;gap:8px;justify-content:center"><button class="primary" type="submit">Sign in</button><button type="button" id="create">Create account</button></div>
    <button type="button" class="link" id="reset">Forgot password?</button>
  </form></div>`;
  const auth=firebase.auth(),em=()=>document.getElementById('em').value.trim(),pw=()=>document.getElementById('pw').value;
  document.getElementById('signin').addEventListener('click',()=>{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
    // popup works on Safari and iPhone; redirect is only a fallback because Safari blocks the storage it needs
    auth.signInWithPopup(p).catch(e=>{if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code))return auth.signInWithRedirect(p);throw e}).catch(e=>signInView(authMsg(e)))});
  document.getElementById('emailform').addEventListener('submit',e=>{e.preventDefault();auth.signInWithEmailAndPassword(em(),pw()).catch(e=>signInView(authMsg(e)))});
  document.getElementById('create').addEventListener('click',()=>{if(!document.getElementById('emailform').reportValidity())return;auth.createUserWithEmailAndPassword(em(),pw()).catch(e=>signInView(authMsg(e)))});
  document.getElementById('reset').addEventListener('click',()=>{if(!em())return signInView('Type your email first, then tap Forgot password.');
    auth.sendPasswordResetEmail(em()).then(()=>signInView('Password reset email sent. Check your inbox.')).catch(e=>signInView(authMsg(e)))});
}
function importView(){
  app.innerHTML=`<div class="panel empty" style="display:grid;gap:14px;justify-items:center"><h2>Bring in your data</h2>
  <p>Your tracker is empty. Choose the <b>moolah-data</b> backup file Claude gave you to load your months, savings plan and loans.</p>
  <input type="file" id="importfile" accept="application/json,.json"><p class="hint">Or <button class="link" id="startempty">start with an empty tracker</button>.</p></div>`;
  document.getElementById('startempty').addEventListener('click',()=>{loaded=true;render()});
  document.getElementById('importfile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;
    try{const data=JSON.parse(await f.text());let n=0;
      for(const [col,docs] of Object.entries(data))for(const [id,body] of Object.entries(docs||{})){if(!['months','loans','settings'].includes(col))continue;await db.doc(col+'/'+id).set(body);n++}
      setStatus(`Imported ${n} records`)}catch(err){setStatus("That file couldn't be read. Choose the moolah-data .json file.",true)}});
}
async function exportData(){const out={months,loans,settings:{main:settings}};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  // on phones the share sheet is the reliable way to save a file from a home-screen app
  const file=new File([blob],`moolah-data-${TODAY}.json`,{type:'application/json'});
  if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Moolah backup'});return}catch(e){if(e&&e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`moolah-data-${TODAY}.json`;document.body.appendChild(a);a.click();a.remove()}
(async()=>{
  route();
  if(!window.firebase||!window.MOOLAH_FIREBASE||!window.MOOLAH_FIREBASE.apiKey){app.innerHTML=`<div class="panel empty"><h2>Almost ready</h2><p>This app hasn't been connected to its database yet.</p></div>`;return}
  firebase.initializeApp(window.MOOLAH_FIREBASE);
  const fs=firebase.firestore();
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(_){}
  let unsub=[];
  firebase.auth().getRedirectResult().catch(e=>signInView(authMsg(e)));
  firebase.auth().onAuthStateChanged(u=>{
    unsub.forEach(f=>f());unsub=[];loaded=false;months={};loans={};settings={sources:{},customCats:[],goals:{}};
    if(!u){foot.hidden=true;signInView();return}
    db=firestoreDb(fs,u.uid);canWrite=true;
    foot.hidden=false;foot.querySelector('#who').textContent=u.email||u.displayName||'you';
    app.innerHTML='<div class="panel empty">Loading your tracker…</div>';
    let gotM=false,gotS=false,gotL=false,sExists=false;
    const ready=()=>{if(!(gotM&&gotS&&gotL)||loaded){if(loaded)render();return}
      if(!sExists&&!Object.keys(months).length){importView();return}
      loaded=true;migrateSettings();migrateSettings2();migrateSettings3();migrateSettings4();if(!KEYS.some(hasData))curMonth=KEYS.includes(NOWKEY)?NOWKEY:KEYS[0];render()};
    unsub.push(db.collection('months').onSnapshot(snap=>{const next={};for(const doc of snap.docs){if(saving['months/'+doc.id])next[doc.id]=months[doc.id];else next[doc.id]=clone(doc.data())}
      for(const p in saving)if(p.startsWith('months/')){const id=p.slice(7);next[id]=months[id]}months=next;gotM=true;ready()},
      e=>{setStatus('Live updates stopped. Reload to reconnect.',true)}));
    unsub.push(db.collection('loans').onSnapshot(snap=>{const next={};for(const doc of snap.docs)next[doc.id]=saving['loans/'+doc.id]?loans[doc.id]:clone(doc.data());
      for(const p in saving)if(p.startsWith('loans/'))next[p.slice(6)]=loans[p.slice(6)];loans=next;gotL=true;ready()},()=>{gotL=true;ready()}));
    unsub.push(db.doc('settings/main').onSnapshot(snap=>{sExists=snap.exists;if(!saving['settings/main']&&snap.exists)settings=clone(snap.data());gotS=true;ready()},()=>{gotS=true;ready()}));
  });
  document.getElementById('signout').addEventListener('click',()=>firebase.auth().signOut());
  document.getElementById('export').addEventListener('click',exportData);
})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
